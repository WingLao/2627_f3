<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>F3 Test 1 成績查詢</title>
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --ink:#1d1f23; --muted:#5f6670; --line:#dedbd2;
  --accent:#1f5f8b; --accent-ink:#ffffff; --code-bg:#f2f1ec; --gutter:#9a9fa6;
  --warn-bg:#fff4dc; --warn-ink:#7a5200; --err:#a8322d;
  --ok:#25704a; --ok-bg:#e5f3ea; --bad:#a8322d; --bad-bg:#fbe9e7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --surface:#1e2125; --ink:#e7e7e4; --muted:#a2a8b0; --line:#33373d;
    --accent:#6fb0dd; --accent-ink:#0d1a24; --code-bg:#181a1e; --gutter:#6a7079;
    --warn-bg:#3a2f15; --warn-ink:#f2d08a; --err:#f08a84;
    --ok:#7fd3a4; --ok-bg:#183326; --bad:#f08a84; --bad-bg:#3a1f1d;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --surface:#1e2125; --ink:#e7e7e4; --muted:#a2a8b0; --line:#33373d;
  --accent:#6fb0dd; --accent-ink:#0d1a24; --code-bg:#181a1e; --gutter:#6a7079;
  --warn-bg:#3a2f15; --warn-ink:#f2d08a; --err:#f08a84;
  --ok:#7fd3a4; --ok-bg:#183326; --bad:#f08a84; --bad-bg:#3a1f1d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:860px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:.01em}
.sub{color:var(--muted);margin:0 0 24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
form{display:flex;gap:10px;flex-wrap:wrap}
label{display:block;font-weight:600;margin-bottom:8px}
input{flex:1 1 220px;min-width:0;font:inherit;font-size:1.15rem;letter-spacing:.08em;padding:10px 12px;
  border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:600;padding:10px 20px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.hint{color:var(--muted);font-size:.9rem;margin:10px 0 0}
.msg{margin-top:12px;color:var(--err);font-weight:600;min-height:1.6em}
#result{margin-top:24px}
.who{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:14px}
.who h2{margin:0;font-size:1.3rem}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;border:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.pill.paper{border-color:var(--accent);color:var(--accent);font-weight:700}
.scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 8px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.tile .k{font-size:.82rem;color:var(--muted)}
.tile .v{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.tile .v small{font-size:.9rem;font-weight:500;color:var(--muted)}
.tile.total{border-color:var(--accent)}
.prov{color:var(--muted);font-size:.85rem;margin:0 0 4px}
nav.tabs{display:flex;gap:6px;margin:22px 0 4px;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;color:var(--muted);border-radius:8px 8px 0 0;padding:8px 14px;border-bottom:2px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.file{color:var(--muted);font-size:.85rem;word-break:break-all;margin:12px 0}
.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px 12px;margin:12px 0;font-size:.95rem}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}
.toolbar label{display:flex;gap:8px;align-items:center;font-weight:500;margin:0;cursor:pointer}
.toolbar input{flex:none;width:18px;height:18px}
.tally{color:var(--muted);font-size:.9rem}
.mc{border:1px solid var(--line);border-radius:10px;margin-top:10px;overflow:hidden}
.mc .hd{display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
.mc.ok .hd{background:var(--ok-bg)} .mc.bad .hd{background:var(--bad-bg)}
.mark{font-weight:700;font-size:.95rem;min-width:4.6em}
.mc.ok .mark{color:var(--ok)} .mc.bad .mark{color:var(--bad)}
.qn{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}
.ans{font-size:.9rem;color:var(--muted)}
.ans b{color:var(--ink)}
.mc .bd{padding:10px 12px}
.stem{margin:0}
.stem.zh{color:var(--muted);font-size:.93rem}
.mc pre{margin:8px 0 0}
.opts{list-style:none;padding:0;margin:10px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.opts li{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.95rem;word-break:break-word}
.opts li .l{font-weight:700;margin-right:6px}
.opts li.key{border-color:var(--ok);background:var(--ok-bg)}
.opts li.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opts li .tag{float:right;font-size:.8rem;font-weight:700;margin-left:6px}
.opts li.key .tag{color:var(--ok)} .opts li.wrong .tag{color:var(--bad)}
.opts.code li{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
.q{margin-top:22px}
.q h3{font-size:1rem;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.q h3 .num{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--accent)}
.q h3 .t{font-weight:500;color:var(--muted);flex:1 1 0;min-width:0}
.q h3 .sc{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.why{border-radius:8px;padding:8px 12px;margin:0 0 8px;font-size:.95rem}
.why.full{background:var(--ok-bg);color:var(--ok)}
.why.part{background:var(--warn-bg);color:var(--warn-ink)}
.why.zero{background:var(--bad-bg);color:var(--bad)}
pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 0;overflow-x:auto;
  font:13.5px/1.55 ui-monospace,Menlo,Consolas,monospace;tab-size:4}
pre .ln{display:block;padding:0 14px 0 0;white-space:pre}
pre .ln::before{content:attr(data-n);display:inline-block;width:3.2em;padding-right:12px;text-align:right;color:var(--gutter);user-select:none}
pre.plain .ln{padding:0 14px}
pre.plain .ln::before{display:none}
.empty{color:var(--muted);font-style:italic;padding:10px 12px;border:1px dashed var(--line);border-radius:8px}
details{margin-top:24px}
summary{cursor:pointer;font-weight:600}
details pre{margin-top:10px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px;flex-wrap:wrap}
.link{background:none;color:var(--accent);padding:0;font-weight:600}
footer{color:var(--muted);font-size:.8rem;margin-top:40px;text-align:center}
@media (max-width:560px){
  .scores{grid-template-columns:1fr 1fr}
  .tile.total{grid-column:1 / -1}
  .opts{grid-template-columns:1fr}
}
</style>
</head>

<main>
  <h1>F3 Test 1 成績查詢</h1>

s at least 30. Which condition is correct?", "溫度 t 不少於 30 度便算炎熱。哪一個條件正確？"], "opts": {"A": "if (t => 30)", "B": "if (t > 30)", "C": "if (t = 30)", "D": "if (t >= 30)"}}, "3": {"stem": ["What is the output of the following code?", "下列程式的輸出為何？", "for (int i = 1; i <= 9; i = i + 2) {", "    cout << i << \" \";", "}"], "opts": {"A": "1 3 5 7", "B": "2 4 6 8", "C": "1 3 5 7 9", "D": "1 2 3 4 5 6 7 8 9"}}, "4": {"stem": ["What is the last (rightmost) binary digit of 42₁₀?", "十進位 42₁₀ 的二進位最後一位是甚麼？"], "opts": {"A": "1", "B": "2", "C": "4", "D": "0"}}, "5": {"stem": ["Which is the 4-bit binary form of the hexadecimal digit D?", "十六進位數字 D 的四位二進位是甚麼？"], "opts": {"A": "1011", "B": "1101", "C": "1110", "D": "1100"}}, "6": {"stem": ["Which C++ condition tests exactly whether N is from 1 to 9, inclusive?", "哪個 C++ 條件能準確判斷 N 是否在 1 至 9 之間（包括兩端）？"], "opts": {"A": "N >= 1 || N <= 9", "B": "1 <= N <= 9", "C": "N >= 1 && N <= 9", "D": "N > 1 && N < 9"}}, "7": {"stem": ["A ticket is free when the colour code c is 1 or 4. Which condition is correct?", "顏色代碼 c 是 1 或 4 時免費。哪一個條件正確？"], "opts": {"A": "c == 1 || c == 4", "B": "c == 1 && c == 4", "C": "c = 1 || c = 4", "D": "c > 1 && c < 4"}}, "8": {"stem": ["How many times does this loop run?", "這個迴圈會執行多少次？", "for (int i = 1; i <= 6; i++) { }"], "opts": {"A": "5", "B": "7", "C": "6", "D": "0"}}, "9": {"stem": ["Convert 53₁₀ to binary.", "把 53₁₀ 轉換成二進位。"], "opts": {"A": "110101", "B": "101101", "C": "110011", "D": "110100"}}, "10": {"stem": ["Convert 11001101₂ to decimal.", "把 11001101₂ 轉換成十進位。"], "opts": {"A": "201", "B": "205", "C": "203", "D": "213"}}, "11": {"stem": ["What is the value of 31 / 7? Both operands are int.", "31 / 7 的值是多少？兩個運算元均為 int。"], "opts": {"A": "3", "B": "4.43", "C": "5", "D": "4"}}, "12": {"stem": ["What is the value of 31 % 7?", "31 % 7 的值是多少？"], "opts": {"A": "3", "B": "4", "C": "7", "D": "0"}}, "13": {"stem": ["What is the value of 9 > 9 || 3 <= 3?", "9 > 9 || 3 <= 3 的值是多少？"], "opts": {"A": "false", "B": "9", "C": "tr  % 5 + 6?", "(8 + 5) % 5 + 6 的值是多少？"], "opts": {"A": "3", "B": "9", "C": "8", "D": "19"}}, "26": {"stem": ["What is the value of 14 & 7?", "14 & 7 的值是多少？"], "opts": {"A": "15", "B": "6", "C": "21", "D": "9"}}, "27": {"stem": ["What is the value of (9 & 12) | 2?", "(9 & 12) | 2 的值是多少？"], "opts": {"A": "8", "B": "11", "C": "10", "D": "14"}}, "28": {"stem": ["N! means 1 × 2 × ... × N. A program computes N! in int ans. At N = 20 the correct product exceeds the int range. Which change stores the correct integer product?", "N! 表示 1 × 2 × ... × N。程式用 int ans 計算 N!。N = 20 時，正確乘積超出 int 範圍。哪個修改能儲存正確整數乘積？"], "opts": {"A": "Start the loop at i = 0 / 從 i = 0 開始迴圈", "B": "Declare ans as long long / 把 ans 宣告為 long long", "C": "Print ans with setprecision(0) / 用 setprecision(0) 輸出 ans", "D": "Change i++ to i += 2 / 把 i++ 改為 i += 2"}}, "29": {"stem": ["When n = 4, how many numbers does this loop read?", "當 n = 4 時，這個迴圈會讀入多少個數字？", "for (int i = 1; i < n; i++) {", "    cin >> x;", "    sum = sum + x;", "}"], "opts": {"A": "4", "B": "3", "C": "5", "D": "The loop never ends / 迴圈永不結束"}}, "30": {"stem": ["The program should print 2+4+6=12 when n = 6. Which line should fill the blank?", "當 n = 6 時程式應輸出 2+4+6=12。空格應填哪一行？", "int sum = 0;", "for (int i = 2; i <= n; i = i + 2) {", "    cout << i;", "    /* ...... blank 空格 ...... */", "    sum = sum + i;", "}", "cout << \"=\" << sum;"], "opts": {"A": "if (i + 2 <= n) cout << \"+\";", "B": "if (i <= n) cout << \"+\";", "C": "cout << \"+\";", "D": "if (i == n) cout << \"+\";"}}}};
const $ = (s) => document.querySelector(s);
const enc = new TextEncoder(), dec = new TextDecoder();
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const b64 = (u) => btoa(String.fromCharCode(...u));
const normId = (s) => s.toUpperCase().replace(/[^0-9X]/g, "");

async function lookup(id) {
  const base = await crypto.subtle.importKey("raw", enc.encode(id), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: unb64(DB.salt), iterations: DB.iter, hash: "SHA-256" }, base, 512));
  const tag = b64(bits.slice(32)).slice(0, 22);
  const hit = DB.d[tag];
  if (!hit) return null;
  const [iv, ct] = hit.split(".");
  const key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(iv) }, key, unb64(ct));
  return JSON.parse(dec.decode(pt));
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function codeBlock(src, plain) {
  const pre = el("pre", plain ? "plain" : null);
  src.replace(/\r\n?/g, "\n").split("\n").forEach((line, i) => {
    const s = el("span", "ln", line || " ");
    s.dataset.n = i + 1;
    pre.appendChild(s);
  });
  return pre;
}
function tile(k, v, max, cls) {
  const t = el("div", "tile" + (cls ? " " + cls : ""));
  t.appendChild(el("div", "k", k));
  const val = el("div", "v", v == null ? "—" : String(v));
  if (v != null) val.appendChild(el("small", null, ` / ${max}`));
  t.appendChild(val);
  return t;
}

function mcqPanel(r) {
  const p = el("div");
  if (!r.mcq) { p.appendChild(el("p", "note", "沒有你的甲部選擇題成績（缺考或答題紙未掃描）。如有疑問請問老師。")); return p; }
  const items = r.mcq.items;
  const right = items.filter(([s, k]) => s === k).length;
  const bar = el("div", "toolbar");
  bar.appendChild(el("span", "tally", `答對 ${right} 題、答錯 ${30 - right} 題 · 每題 2 分，答錯不倒扣`));
  const lab = el("label"); const cb = el("input"); cb.type = "checkbox";
  lab.append(cb, document.createTextNode("只顯示答錯的題目"));
  bar.appendChild(lab);
  p.appendChild(bar);
  const list = el("div");
  items.forEach(([stu, key], i) => {
    const n = i + 1, q = QT[r.paper][n], ok = stu === key;
    const box = el("section", "mc " + (ok ? "ok" : "bad"));
    box.dataset.ok = ok ? "1" : "0";
    const hd = el("div", "hd");
    hd.appendChild(el("span", "qn", `Q${n}`));
    hd.appendChild(el("span", "mark", ok ? "✓ +2 分" : "✗ 0 分"));
    const a = el("span", "ans");
    a.append("你的答案 "); a.appendChild(el("b", null, stu || "（空白）"));
    a.append(" · 正確答案 "); a.appendChild(el("b", null, key));
    hd.appendChild(a);
    box.appendChild(hd);
    const bd = el("div", "bd");
    bd.appendChild(el("p", "stem", q.stem[0]));
    if (q.stem[1]) bd.appendChild(el("p", "stem zh", q.stem[1]));
    if (q.stem.length > 2) bd.appendChild(codeBlock(q.stem.slice(2).join("\n"), true));
    const isCode = /[;(]/.test(Object.values(q.opts).join(""));
    const ul = el("ul", "opts" + (isCode ? " code" : ""));
    for (const L of "ABCD") {
      const li = el("li", L === key ? "key" : (L === stu ? "wrong" : ""));
      if (L === key) li.appendChild(el("span", "tag", L === stu ? "你的答案 ✓" : "正確答案"));
      else if (L === stu) li.appendChild(el("span", "tag", "你的答案 ✗"));
      li.appendChild(el("span", "l", L + "."));
      li.append(q.opts[L]);
      ul.appendChild(li);
    }
    bd.appendChild(ul);
    box.appendChild(bd);
    list.appendChild(box);
  });
  cb.onchange = () => list.querySelectorAll(".mc").forEach((b) => { b.hidden = cb.checked && b.dataset.ok === "1"; });
  p.appendChild(list);
  return p;
}

function progPanel(r) {
  const p = el("div");
  if (!r.prog) { p.appendChild(el("p", "note", "沒有收到你的乙部編程題檔案，乙部以 0 分計算。如你有交卷，請盡快告訴老師。")); return p; }
  const g = r.prog;
  p.appendChild(el("p", "file", `交卷檔案：${g.file}`));
  p.appendChild(el("p", "prov", "評分方法：每題獨立編譯，再用老師的測試數據執行並按評分準則給分；學生自己寫錯語法而不能編譯的題目 0 分；模板錯或少 copy（例如漏 #include、int main()）不扣分，補回後評分。[-n 項目] 表示該項扣 n 分。"));
  if (g.note) p.appendChild(el("p", "note", g.note));
  if (!g.raw.trim()) p.appendChild(el("p", "note", "你交的檔案是空白的，沒有任何內容。"));
  for (const q of g.qs) {
    const sec = el("section", "q");
    const h = el("h3");
    h.appendChild(el("span", "num", q.q));
    h.appendChild(el("span", "t", q.title));
    h.appendChild(el("span", "sc", `${q.score} / ${q.full} 分`));
    sec.appendChild(h);
    const cls = q.score === q.full ? "full" : (q.score === 0 ? "zero" : "part");
    sec.appendChild(el("p", "why " + cls, q.score === q.full ? "✓ 全對，滿分。" : q.why));
    const body = q.code.replace(/^\s*(\/\/|\\\\|#)?\s*B?-?[1-5][.:]?\s*$/i, "").trim();
    sec.appendChild(body ? codeBlock(q.code) : el("div", "empty", "沒有作答 No answer"));
    p.appendChild(sec);
  }
  if (g.raw.trim()) {
    const d = el("details");
    d.appendChild(el("summary", null, "原始檔案（未分題）Original file"));
    d.appendChild(codeBlock(g.raw));
    p.appendChild(d);
  }
  return p;
}

function render(r) {
  const box = $("#result");
  box.replaceChildren();
  const card = el("div", "card");
  const who = el("div", "who");
  who.appendChild(el("h2", null, `${r.class} ${r.no} 號 ${r.ename} ${r.cname}`));
  who.appendChild(el("span", "pill paper", `${r.paper} 卷 Paper ${r.paper}`));
  card.appendChild(who);
  const prog = r.prog ? r.prog.qs.reduce((s, q) => s + q.score, 0) : 0;
  const sc = el("div", "scores");
  sc.appendChild(tile("甲部 選擇題", r.mcq ? r.mcq.score : null, 60));
  sc.appendChild(tile("乙部 編程題", prog, 50));
  sc.appendChild(tile("總分", r.total, 110, "total"));
  card.appendChild(sc);
  if (r.total != null) card.appendChild(el("p", "prov", r.total >= 60 ? "合格分數為 60 分：你已合格。" : "合格分數為 60 分：你未合格。"));

  const tabs = el("nav", "tabs"); tabs.setAttribute("role", "tablist");
  const panels = [["甲部 選擇題", mcqPanel(r)], ["乙部 編程題", progPanel(r)]];
  panels.forEach(([name, panel], i) => {
    const b = el("button", null, name); b.type = "button"; b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", i === 0 ? "true" : "false");
    panel.hidden = i !== 0;
    b.onclick = () => {
      tabs.querySelectorAll("button").forEach((x, j) => x.setAttribute("aria-selected", j === i ? "true" : "false"));
      panels.forEach(([, pp], j) => { pp.hidden = j !== i; });
    };
    tabs.appendChild(b);
  });
  card.appendChild(tabs);
  panels.forEach(([, panel]) => card.appendChild(panel));

  const bar = el("div", "bar");
  const again = el("button", "link", "← 查詢另一個學生證號碼");
  again.type = "button";
  again.onclick = () => { box.hidden = true; box.replaceChildren(); $("#sid").value = ""; $("#sid").focus(); };
  bar.appendChild(again);
  card.appendChild(bar);
  box.appendChild(card);
  box.hidden = false;
  box.scrollIntoView({ behavior: "smooth", block: "start" });
}

$("#f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const raw = $("#sid").value;
  const id = normId(raw);
  const msg = $("#msg");
  msg.textContent = "";
  if (!/^\d{7}[\dX]$/.test(id)) {
    msg.textContent = "請輸入 8 位學生證號碼（7 位數字，加最後一位數字或 X）。";
    return;
  }
  if (!crypto.subtle) { msg.textContent = "此瀏覽器不支援解密，請改用 Chrome、Safari 或 Edge。"; return; }
  $("#go").disabled = true;
  msg.style.color = "var(--muted)"; msg.textContent = "查詢中…";
  try {
    const r = await lookup(id);
    msg.style.color = "";
    if (!r) { msg.textContent = "找不到這個學生證號碼的成績，請檢查號碼；如有疑問請問老師。"; $("#result").hidden = true; }
    else { msg.textContent = ""; render(r); }
  } catch (e) {
    msg.style.color = ""; msg.textContent = "解密失敗，請重新整理後再試。";
  } finally { $("#go").disabled = false; }
});
</script>
